<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E6A61">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="משימות הבית">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%231E6A61%22/%3E%3Cpath d=%22M18 33l9 9 19-20%22 fill=%22none%22 stroke=%22white%22 stroke-width=%227%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>משימות הבית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column, thumb-first. Bottom tab bar + floating add button; editing in bottom sheets. */
:root{
  --bg:#F2F3EE; --surface:#FFFFFF; --ink:#1B2321; --muted:#65706B; --line:#E1E4DC;
  --accent:#1E6A61; --accent-ink:#FFFFFF; --accent-soft:#DCEDE8;
  --sun:#B97A0B; --sun-soft:#FBEFD3; --plum:#7A4686; --plum-soft:#F0E4F3;
  --danger:#B23C2B; --danger-soft:#F8E1DC; --shadow:0 6px 24px rgba(20,40,35,.12);
  --display:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --body:'Assistant','Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121816; --surface:#1B2320; --ink:#E9EEEB; --muted:#9AA6A1; --line:#2A3430;
    --accent:#5CC0B1; --accent-ink:#0C1F1C; --accent-soft:#1D3833;
    --sun:#EDBB55; --sun-soft:#3A2F17; --plum:#CF9ADB; --plum-soft:#35263A;
    --danger:#F08B78; --danger-soft:#3D221D; --shadow:0 6px 24px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1B2320; --ink:#E9EEEB; --muted:#9AA6A1; --line:#2A3430;
  --accent:#5CC0B1; --accent-ink:#0C1F1C; --accent-soft:#1D3833;
  --sun:#EDBB55; --sun-soft:#3A2F17; --plum:#CF9ADB; --plum-soft:#35263A;
  --danger:#F08B78; --danger-soft:#3D221D; --shadow:0 6px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:560px;margin:0 auto;min-height:100%;padding:0 16px 150px}

header{padding:22px 0 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hdate{font-family:var(--display);font-weight:600;font-size:26px;margin:0;text-wrap:balance;line-height:1.2}
.hsub{color:var(--muted);font-size:15px;margin-top:4px}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.progress{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}

.notice{border-radius:12px;padding:10px 14px;font-size:15px;margin:8px 0;background:var(--sun-soft);color:var(--ink)}
.filters{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

section.group{margin-top:20px}
.ghead{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 8px}
.ghead h2{font-family:var(--display);font-weight:600;font-size:16px;margin:0;color:var(--muted)}
.ghead.late h2{color:var(--danger)}
.ghead .count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
ul.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:58px}
.task:first-child{border-top:0}
.check{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0}
.check svg{width:16px;height:16px;opacity:0}
.task.done .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.task.done .check svg{opacity:1}
.task.done .ttitle{text-decoration:line-through;color:var(--muted)}
.tbody{flex:1;min-width:0;background:none;border:0;padding:0;text-align:inherit;display:flex;flex-direction:column;gap:3px}
.ttitle{font-size:17px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted);align-items:center}
.tag{border-radius:999px;padding:1px 9px;font-weight:600;font-size:13px}
.w-both{background:var(--sun-soft);color:var(--sun)}
.w-a{background:var(--accent-soft);color:var(--accent)}
.w-b{background:var(--plum-soft);color:var(--plum)}
.late-tag{color:var(--danger);font-weight:600}
details.donebox{margin-top:18px}
details.donebox summary{cursor:pointer;color:var(--muted);font-weight:600;padding:6px 4px;font-size:15px}

.empty{text-align:center;color:var(--muted);padding:34px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:16px}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-weight:600;font-size:18px;margin-bottom:4px}

/* goals */
.goal{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.ghd{display:flex;gap:12px;align-items:center;padding:14px;background:none;border:0;width:100%;text-align:inherit}
.gtitle{font-family:var(--display);font-weight:600;font-size:18px;overflow-wrap:anywhere}
.gmeta{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.ring{flex:none;width:44px;height:44px}
.gsteps{border-top:1px solid var(--line)}
.gsteps .task{padding-inline-start:18px}
.addstep{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.addstep input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px}
.gactions{display:flex;gap:8px;padding:0 14px 14px;flex-wrap:wrap}
.btn-s{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 12px;font-size:15px;font-weight:600}
.schedule{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:600}

/* nav + fab */
nav.tabs{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;background:none;border:0;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:14px;font-weight:600}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom));inset-inline-end:max(16px, calc(50% - 264px));width:60px;height:60px;border-radius:20px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);display:grid;place-items:center;z-index:6}
.fab svg{width:28px;height:28px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.45);z-index:10;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92%;overflow:auto;box-shadow:var(--shadow)}
.sheet h3{font-family:var(--display);font-weight:600;font-size:20px;margin:0 0 14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.flabel{font-size:14px;font-weight:600;color:var(--muted)}
.inp{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 14px;width:100%;font-size:17px}
textarea.inp{min-height:70px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;font-weight:600;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheetbtns{display:flex;gap:10px;margin-top:6px}
.primary{flex:1;border:0;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:13px;font-weight:700;font-size:17px}
.ghost{border:1px solid var(--line);background:transparent;border-radius:14px;padding:13px 16px;font-weight:600}
.danger{border:1px solid var(--danger);color:var(--danger);background:transparent;border-radius:14px;padding:13px 16px;font-weight:600}
.danger.armed{background:var(--danger);color:var(--surface)}
.hint{font-size:14px;color:var(--muted);margin:0 0 12px}

.toast{position:fixed;bottom:calc(150px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:none;gap:14px;align-items:center;z-index:20;font-size:15px;max-width:calc(100% - 32px)}
.toast.show{display:flex}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline}
.namecard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.namecard p{margin:0 0 10px;font-weight:600}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div style="flex:1;min-width:0">
      <h1 class="hdate" id="hTitle">היום</h1>
      <div class="hsub" id="hSub"></div>
      <div class="progress" id="hProg" hidden><i style="width:0"></i></div>
    </div>
    <button class="iconbtn" id="btnSettings" aria-label="הגדרות">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><circle cx="6" cy="16" r="2.6"/><circle cx="18" cy="16" r="2.6"/></svg>
    </button>
  </header>
  <div id="notices"></div>
  <main id="main"><div class="empty"><strong>טוען…</strong>מתחבר לרשימה המשותפת</div></main>
</div>

<button class="fab" id="fab" aria-label="הוספה">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabs" aria-label="תצוגות"><div class="in">
  <button data-view="today" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>היום</button>
  <button data-view="next">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>הבא</button>
  <button data-view="plan">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>תכנון</button>
  <button data-view="save">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M15 9.5c-.6-1-1.7-1.5-3-1.5-1.7 0-3 .9-3 2.2 0 3 6 1.4 6 4.3 0 1.3-1.3 2.2-3 2.2-1.4 0-2.6-.6-3.2-1.6"/></svg>חיסכון</button>
</div></nav>

<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastUndo" hidden>ביטול</button></div>

<script>

<script>
(function(){
"use strict";
/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const addMonths=(s,n)=>{const d=parse(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d);};
const today=()=>iso(new Date());
const endOfWeek=()=>{const d=new Date();d.setDate(d.getDate()+(6-d.getDay()));return iso(d);}; // שבת
const fmtLong=new Intl.DateTimeFormat('he-IL',{weekday:'long',day:'numeric',month:'long'});
const fmtShort=new Intl.DateTimeFormat('he-IL',{day:'numeric',month:'long'});
const fmtWd=new Intl.DateTimeFormat('he-IL',{weekday:'long'});
const fmtMonth=new Intl.DateTimeFormat('he-IL',{month:'long',year:'numeric'});
function dayLabel(s){
  const t=today();
  if(s===t) return 'היום';
  if(s===addDays(t,1)) return 'מחר';
  if(s===addDays(t,-1)) return 'אתמול';
  if(s>t && s<=addDays(t,6)) return fmtWd.format(parse(s));
  return fmtShort.format(parse(s));
}
const REPEAT={none:'לא חוזר',daily:'כל יום',weekly:'כל שבוע',monthly:'כל חודש'};
const HORIZON={month:'החודש',quarter:'ברבעון הקרוב',year:'השנה',someday:'מתישהו'};
function nextOcc(t){
  const step=t.repeat==='daily'?s=>addDays(s,1):t.repeat==='weekly'?s=>addDays(s,7):s=>addMonths(s,1);
  let n=step(t.date||today()); const td=today();
  while(n<=td) n=step(n);
  return n;
}

/* ---------- state ---------- */
const state={savings:[],tasks:[],goals:[],settings:{},view:'today',filter:'all',loaded:false,local:false,canWrite:true,offline:false,openGoals:new Set()};
let store=null;
const nameOf=w=>w==='a'?(state.settings.nameA||'שם 1'):w==='b'?(state.settings.nameB||'שם 2'):'ביחד';

/* ---------- stores ---------- */
const queues={};
function queue(key,fn){const p=(queues[key]||Promise.resolve()).catch(()=>{}).then(fn);queues[key]=p;return p;}
function strip(o){const c=Object.assign({},o);delete c.id;return c;}

function makeRtdbStore(db,R,code){
  const base='households/'+code;
  const path=(col,id)=>col==='settings'?base+'/settings':base+'/'+col+'/'+id;
  const list=o=>Object.keys(o||{}).map(id=>Object.assign({id},o[id]));
  let timer=null;
  return {
    listen(){
      timer=setTimeout(()=>{state.offline=true;state.loaded=true;render();},10000);
      R.onValue(R.ref(db,base),snap=>{
        clearTimeout(timer);const v=snap.val()||{};
        state.tasks=list(v.tasks);state.goals=list(v.goals);state.savings=list(v.savings);state.settings=v.settings||{};
        state.loaded=true;state.offline=false;render();
      },e=>{clearTimeout(timer);console.error(e);state.loaded=true;state.offline=true;render();});
    },
    newId(col){return R.push(R.ref(db,base+'/'+col)).key.replace(/[^A-Za-z0-9]/g,'x');},
    set(col,obj){R.set(R.ref(db,path(col,obj.id)),strip(obj)).catch(e=>{toast('השמירה נכשלה. בדקו את החיבור');console.error(e);});return Promise.resolve();},
    del(col,id){R.remove(R.ref(db,path(col,id))).catch(e=>{toast('המחיקה נכשלה. בדקו את החיבור');console.error(e);});return Promise.resolve();}
  };
}
function makeLocalStore(){
  const KEY='beit-tasks-local';
  function save(){try{localStorage.setItem(KEY,JSON.stringify({tasks:state.tasks,goals:state.goals,savings:state.savings,settings:state.settings}));}catch(e){}}
  return {
    listen(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){state.tasks=d.tasks||[];state.goals=d.goals||[];state.savings=d.savings||[];state.settings=d.settings||{};}}catch(e){} state.loaded=true;render();},
    newId(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);},
    set(col,obj){
      if(col==='settings'){state.settings=strip(obj);}
      else{const arr=state[col];const i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=Object.assign({},obj);else arr.push(Object.assign({},obj));}
      save();render();return Promise.resolve();
    },
    del(col,id){state[col]=state[col].filter(x=>x.id!==id);save();render();return Promise.resolve();}
  };
}
function write(p){
  return p.catch(e=>{
    if(e&&e.code==='invalid_argument'&&!state.local){state.canWrite=false;render();toast('אין לך הרשאה לערוך את הרשימה הזאת');}
    else if(e&&e.code==='quota_exceeded'){toast('הרשימה מלאה. מחקו משימות ישנות ונסו שוב');}
    else toast('השמירה נכשלה. בדקו את החיבור ונסו שוב');
    throw e;
  });
}
const saveTask=t=>write(store.set('tasks',t));
const saveGoal=g=>write(store.set('goals',g));

/* ---------- toast ---------- */
let toastTimer=null,undoFn=null;
function toast(msg,undo){
  $('#toastMsg').textContent=msg;undoFn=undo||null;$('#toastUndo').hidden=!undo;
  $('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),4500);
}
$('#toastUndo').addEventListener('click',()=>{if(undoFn)undoFn();undoFn=null;$('#toast').classList.remove('show');});

/* ---------- actions ---------- */
function toggleDone(id){
  const t=state.tasks.find(x=>x.id===id); if(!t||!state.canWrite) return;
  const prev=Object.assign({},t);
  if(!t.done && t.repeat && t.repeat!=='none'){
    const n=Object.assign({},t,{date:nextOcc(t)});
    saveTask(n).then(()=>toast('נהדר! הפעם הבאה: '+dayLabel(n.date),()=>saveTask(prev))).catch(()=>{});
    return;
  }
  const n=Object.assign({},t,{done:!t.done,doneAt:!t.done?today():null});
  saveTask(n).then(()=>{if(n.done)toast('בוצע ✓',()=>saveTask(prev));}).catch(()=>{});
}
function visible(t){return state.filter==='all'||t.who==='both'||t.who===state.filter;}
const byCreated=(a,b)=>(a.createdAt||0)-(b.createdAt||0);

/* ---------- render ---------- */
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function taskRow(t,opts){
  opts=opts||{};
  const meta=[];
  meta.push('<span class="tag w-'+esc(t.who||'both')+'">'+esc(nameOf(t.who||'both'))+'</span>');
  if(opts.showDate&&t.date){const late=!t.done&&t.date<today();meta.push('<span class="'+(late?'late-tag':'')+'">'+esc(dayLabel(t.date))+'</span>');}
  if(t.repeat&&t.repeat!=='none') meta.push('<span>↻ '+esc(REPEAT[t.repeat])+'</span>');
  if(t.goalId&&!opts.inGoal){const g=state.goals.find(x=>x.id===t.goalId);if(g)meta.push('<span>⚑ '+esc(g.title)+'</span>');}

function group(title,tasks,opts,cls){

function renderToday(){
  const td=today(); const open=state.tasks.filter(t=>!t.done&&t.date&&t.date<=td);
  const late=open.filter(t=>t.date<td&&visible(t)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:byCreated(a,b));
  const now=open.filter(t=>t.date===td&&visible(t)).sort(byCreated);
  const doneToday=state.tasks.filter(t=>t.done&&t.doneAt===td&&visible(t)).sort(byCreated);
  const total=late.length+now.length+doneToday.length;
  $('#hTitle').textContent=fmtLong.format(new Date());
  $('#hSub').textContent=total?(doneToday.length+' מתוך '+total+' בוצעו היום'):'';
  const pr=$('#hProg'); pr.hidden=!total; pr.firstElementChild.style.width=(total?Math.round(doneToday.length/total*100):0)+'%';
  let h=nameCard()+filtersHtml();
  h+=group('באיחור',late,{showDate:true},'late');
  h+=group('היום',now,{});
  if(!late.length&&!now.length){
    h+='<section class="group"><div class="empty"><strong>'+(doneToday.length?'סיימתם הכל להיום 🎉':'אין משימות להיום')+'</strong>'+(doneToday.length?'זמן לנוח.':'הוסיפו משימה בכפתור ה־+ למטה.')+'</div></section>';
  }
  if(doneToday.length) h+='<details class="donebox"><summary>בוצעו היום ('+doneToday.length+')</summary><ul class="list">'+doneToday.map(t=>taskRow(t)).join('')+'</ul></details>';
  return h;
}
function renderNext(){
  const td=today(),tm=addDays(td,1),eow=endOfWeek(),eonw=addDays(eow,7);
  $('#hTitle').textContent='מה מחכה לנו';$('#hSub').textContent='משימות מתוזמנות ומשימות בלי תאריך';$('#hProg').hidden=true;
  const fut=state.tasks.filter(t=>!t.done&&t.date&&t.date>td&&visible(t)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:byCreated(a,b));
  const nodate=state.tasks.filter(t=>!t.done&&!t.date&&!t.goalId&&visible(t)).sort(byCreated);
  let h=filtersHtml();
  h+=group('מחר',fut.filter(t=>t.date===tm),{});
  h+=group('בהמשך השבוע',fut.filter(t=>t.date>tm&&t.date<=eow),{showDate:true});
  h+=group('שבוע הבא',fut.filter(t=>t.date>eow&&t.date<=eonw&&t.date>tm),{showDate:true});
  const later=fut.filter(t=>t.date>eonw&&t.date>tm);
  const months={};later.forEach(t=>{const k=t.date.slice(0,7);(months[k]=months[k]||[]).push(t);});
  Object.keys(months).sort().forEach(k=>{h+=group(fmtMonth.format(parse(k+'-01')),months[k],{showDate:true});});
  h+=group('בלי תאריך',nodate,{});
  if(!fut.length&&!nodate.length) h+='<section class="group"><div class="empty"><strong>שום דבר עוד לא מתוכנן</strong>משימות עם תאריך עתידי יופיעו כאן.</div></section>';
  return h;
}
function ring(p){
  const r=18,c=2*Math.PI*r;
  return '<svg class="ring" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="22" cy="22" r="'+r+'" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+(c*p).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 22 22)"/><text x="22" y="26.5" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)" font-family="Rubik,sans-serif">'+Math.round(p*100)+'%</text></svg>';
}
function goalCard(g){
  const steps=state.tasks.filter(t=>t.goalId===g.id).sort((a,b)=>(a.done-b.done)||byCreated(a,b));
  const done=steps.filter(t=>t.done).length;
  const svs=state.savings.filter(x=>x.goalId===g.id).sort(byCreated);
  const svT=svs.filter(x=>+x.target>0);
  const svP=svT.reduce((a,x)=>a+Math.min(1,(+x.saved||0)/+x.target),0);
  const parts=steps.length+svT.length; const p=parts?(done+svP)/parts:(g.done?1:0);
  const svSum=svs.reduce((a,x)=>a+(+x.saved||0),0),svTg=svs.reduce((a,x)=>a+(+x.target||0),0);
  const metaTxt=[steps.length?done+' מתוך '+steps.length+' צעדים':(svs.length?'':'עוד אין צעדים'),svs.length?'נחסכו '+money(svSum)+(svTg?' מתוך '+money(svTg):''):''].filter(Boolean).join(' · ');
  const isOpen=state.openGoals.has(g.id);
  let h='<div class="goal"><button class="ghd" data-toggle-goal="'+esc(g.id)+'" aria-expanded="'+isOpen+'">'+ring(p)+'<div style="flex:1;min-width:0"><div class="gtitle">'+esc(g.title)+'</div><div class="gmeta">'+esc(metaTxt)+'</div></div><span aria-hidden="true" style="color:var(--muted)">'+(isOpen?'▴':'▾')+'</span></button>';
  if(isOpen){
    if(g.note) h+='<p class="hint" style="padding:0 14px">'+esc(g.note)+'</p>';
    h+='<div class="gsteps">'+(steps.length?'<ul class="list" style="border:0;border-radius:0">'+steps.map(t=>taskRow(t,{inGoal:true,showDate:true})).join('')+'</ul>':'')+'</div>';
    if(svs.length) h+='<ul class="list" style="border:0;border-radius:0;border-top:1px solid var(--line)">'+svs.map(x=>{const sv=+x.saved||0,tg=+x.target||0,pc=tg?Math.min(100,Math.round(sv/tg*100)):0;
      return '<li class="task" style="padding-inline-start:18px"><span aria-hidden="true" style="flex:none;width:28px;height:28px;border-radius:50%;background:var(--sun-soft);color:var(--sun);display:grid;place-items:center;font-weight:700">₪</span><div class="tbody"><span class="ttitle">'+esc(x.title)+'</span><span class="meta"><span>'+esc(money(sv)+(tg?' מתוך '+money(tg)+' ('+pc+'%)':' נחסכו'))+'</span></span>'+(tg?'<div class="progress" style="margin:4px 0 0"><i style="width:'+pc+'%"></i></div>':'')+'</div>'+(state.canWrite?'<button class="btn-s" data-dep="'+esc(x.id)+'">הפקדה</button>':'')+'</li>';}).join('')+'</ul>';
    if(state.canWrite){
      h+='<form class="addstep" data-addstep="'+esc(g.id)+'"><input placeholder="צעד חדש…" aria-label="צעד חדש" id="as-'+esc(g.id)+'"><button class="btn-s" type="submit">הוספה</button></form>';
      h+='<div class="gactions"><button class="btn-s" data-edit-goal="'+esc(g.id)+'">עריכת יעד</button><button class="btn-s" data-add-saving="'+esc(g.id)+'">+ חיסכון ליעד</button><button class="btn-s" data-goal-done="'+esc(g.id)+'">'+(g.done?'החזרה ליעדים פעילים':'הושג! ✓')+'</button></div>';
    }
  }
  return h+'</div>';
}
function renderPlan(){
  $('#hTitle').textContent='תכנון לטווח ארוך';$('#hSub').textContent='יעדים גדולים, מפורקים לצעדים קטנים';$('#hProg').hidden=true;
  const active=state.goals.filter(g=>!g.done);const achieved=state.goals.filter(g=>g.done);

function render(){

/* ---------- savings ---------- */
const money=n=>new Intl.NumberFormat('he-IL',{style:'currency',currency:'ILS',maximumFractionDigits:0}).format(Math.round(+n||0));
const saveSaving=s=>write(store.set('savings',s));
function savingCard(s){
  const saved=+s.saved||0,target=+s.target||0,p=target?Math.min(1,saved/target):0;
  let hint='';
  if(target&&saved>=target) hint='הגעתם ליעד 🎉';
  else if(target&&s.due){
    const days=Math.round((parse(s.due)-parse(today()))/864e5);
    hint=days<=0?'תאריך היעד עבר. חסרים עוד '+money(target-saved):'כדי להגיע עד '+fmtShort.format(parse(s.due))+': בערך '+money((target-saved)/Math.max(1,Math.ceil(days/30.44)))+' בחודש';
  } else if(target) hint='חסרים עוד '+money(target-saved);
  const log=(s.log||[]).slice(-5).reverse();const gl=s.goalId?state.goals.find(g=>g.id===s.goalId):null;
  let h='<div class="goal"><div class="ghd" style="cursor:default">'+(target?ring(p):'')+'<div style="flex:1;min-width:0"><div class="gtitle">'+esc(s.title)+'</div><div class="gmeta">'+money(saved)+(target?' מתוך '+money(target):' נחסכו')+(gl?' · ⚑ '+esc(gl.title):'')+'</div></div></div>';
  if(hint) h+='<p class="hint" style="padding:0 14px">'+esc(hint)+'</p>';
  if(log.length) h+='<details class="donebox" style="margin:0 14px 10px"><summary>תנועות אחרונות</summary><ul class="list">'+log.map(l=>'<li class="task" style="min-height:0"><span style="flex:1">'+esc(dayLabel(l.d))+'</span><span dir="ltr" style="font-variant-numeric:tabular-nums;font-weight:600;color:'+(l.a<0?'var(--danger)':'var(--accent)')+'">'+(l.a<0?'−':'+')+esc(money(Math.abs(l.a)))+'</span></li>').join('')+'</ul></details>';
  if(state.canWrite) h+='<div class="gactions"><button class="btn-s" data-dep="'+esc(s.id)+'" style="background:var(--accent);color:var(--accent-ink);border-color:var(--accent)">הפקדה / משיכה</button><button class="btn-s" data-edit-saving="'+esc(s.id)+'">עריכה</button></div>';
  return h+'</div>';
}
function renderSave(){
  const list=state.savings.slice().sort(byCreated);
  const tot=list.reduce((a,s)=>a+(+s.saved||0),0),tg=list.reduce((a,s)=>a+(+s.target||0),0);
  $('#hTitle').textContent='חיסכון';
  $('#hSub').textContent=list.length?('סה״כ נחסך: '+money(tot)+(tg?' מתוך '+money(tg):'')):'חוסכים ביחד למטרות שלכם';
  const pr=$('#hProg');pr.hidden=!tg;pr.firstElementChild.style.width=(tg?Math.min(100,Math.round(tot/tg*100)):0)+'%';
  if(!list.length) return '<section class="group"><div class="empty"><strong>עוד אין חסכונות</strong>חופשה, רכב, קרן חירום… הוסיפו חיסכון בכפתור ה־+ ועקבו אחרי ההתקדמות.</div></section>';
  return '<section class="group">'+list.map(savingCard).join('')+'</section>';
}
function openSaving(id,defaults){
  const sv=id?state.savings.find(x=>x.id===id):null; if(id&&!sv) return;
  const d=Object.assign({title:'',target:'',saved:'',due:'',goalId:null},defaults||{},sv||{});
  const goalOpts='<option value="">בלי</option>'+state.goals.filter(g=>!g.done||g.id===d.goalId).map(g=>'<option value="'+esc(g.id)+'"'+(g.id===d.goalId?' selected':'')+'>'+esc(g.title)+'</option>').join('');
  openSheet('<h3>'+(sv?'עריכת חיסכון':'חיסכון חדש')+'</h3><form id="vf">'+
    '<div class="field"><label for="v-title">למה חוסכים?</label><input class="inp" id="v-title" required maxlength="100" value="'+esc(d.title)+'" placeholder="למשל: חופשה בקיץ" autocomplete="off"></div>'+
    '<div class="row2"><div class="field"><label for="v-target">סכום יעד (₪)</label><input class="inp" id="v-target" type="number" inputmode="decimal" min="0" step="any" value="'+esc(d.target||'')+'" placeholder="לא חובה"></div>'+
    '<div class="field"><label for="v-saved">כמה יש כבר (₪)</label><input class="inp" id="v-saved" type="number" inputmode="decimal" min="0" step="any" value="'+esc(d.saved||'')+'" placeholder="0"></div></div>'+
    '<div class="field"><label for="v-due">תאריך יעד (לא חובה)</label><input class="inp" id="v-due" type="date" value="'+esc(d.due||'')+'"></div>'+
    '<div class="field"><label for="v-goal">חלק מיעד (בלשונית תכנון)</label><select class="inp" id="v-goal">'+goalOpts+'</select></div>'+
    '<div class="sheetbtns"><button class="primary" type="submit">שמירה</button>'+(sv?'<button class="danger" type="button" id="v-del">מחיקה</button>':'')+'<button class="ghost" type="button" id="v-cancel">ביטול</button></div></form>',
  root=>{
    root.querySelector('#v-cancel').addEventListener('click',closeSheet);
    if(!sv) setTimeout(()=>{const x=root.querySelector('#v-title');if(x)x.focus();},50);
    const del=root.querySelector('#v-del');
    if(del) armDelete(del,()=>{const prev=Object.assign({},sv);closeSheet();write(store.del('savings',sv.id)).then(()=>toast('החיסכון נמחק',()=>saveSaving(prev))).catch(()=>{});});
    root.querySelector('#vf').addEventListener('submit',e=>{
      e.preventDefault();const title=root.querySelector('#v-title').value.trim();if(!title)return;
      const num=q=>Math.max(0,parseFloat(root.querySelector(q).value)||0);
      const obj=Object.assign({},sv||{id:store.newId('savings'),log:[],createdAt:Date.now()},{title,target:num('#v-target'),saved:num('#v-saved'),due:root.querySelector('#v-due').value||null,goalId:root.querySelector('#v-goal').value||null});
      closeSheet();saveSaving(obj).catch(()=>{});
    });
  });
}
function openDeposit(id){
  const sv=state.savings.find(x=>x.id===id); if(!sv) return;
  openSheet('<h3>'+esc(sv.title)+'</h3><p class="hint">יש כרגע '+esc(money(sv.saved))+'</p><form id="df">'+
    '<div class="field"><label for="d-amt">סכום (₪)</label><input class="inp" id="d-amt" type="number" inputmode="decimal" min="0" step="any" required placeholder="למשל 500"></div>'+
    '<div class="sheetbtns"><button class="primary" type="submit" data-sign="1">הפקדה</button><button class="ghost" type="submit" data-sign="-1">משיכה</button><button class="ghost" type="button" id="d-cancel">ביטול</button></div></form>',
  root=>{
    root.querySelector('#d-cancel').addEventListener('click',closeSheet);
    setTimeout(()=>{const x=root.querySelector('#d-amt');if(x)x.focus();},50);
    root.querySelector('#df').addEventListener('submit',e=>{
      e.preventDefault();const amt=parseFloat(root.querySelector('#d-amt').value)||0;if(amt<=0)return;
      const sign=e.submitter&&e.submitter.dataset.sign==='-1'?-1:1;
      const cur=+sv.saved||0;const delta=sign<0?-Math.min(amt,cur):amt;if(!delta){closeSheet();toast('אין ממה למשוך');return;}
      const prev=Object.assign({},sv);
      const obj=Object.assign({},sv,{saved:cur+delta,log:(sv.log||[]).concat([{a:delta,d:today()}]).slice(-30)});
      closeSheet();saveSaving(obj).then(()=>toast((delta>0?'הופקדו ':'נמשכו ')+money(Math.abs(delta)),()=>saveSaving(prev))).catch(()=>{});
    });
  });
}

/* ---------- events ---------- */
document.querySelector('nav.tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(!b)return;state.view=b.dataset.view;render();window.scrollTo(0,0);});
$('#fab').addEventListener('click',()=>{
  if(state.view==='plan') openGoal(null);
  else if(state.view==='save') openSaving(null);
  else openTask(null,{date:state.view==='next'?addDays(today(),1):today(),who:state.filter==='all'?'both':state.filter});
});
$('#btnSettings').addEventListener('click',openSettings);
$('#main').addEventListener('click',e=>{
  const el=e.target.closest('[data-check],[data-edit],[data-filter],[data-toggle-goal],[data-edit-goal],[data-goal-done],[data-sched],[data-dep],[data-edit-saving],[data-add-saving],#ncSave');
  if(!el) return;
  if(el.dataset.check){toggleDone(el.dataset.check);}
  else if(el.dataset.sched){openTask(el.dataset.sched,{});}
  else if(el.dataset.edit){openTask(el.dataset.edit);}
  else if(el.dataset.filter){state.filter=el.dataset.filter;render();}
  else if(el.dataset.toggleGoal){const id=el.dataset.toggleGoal;state.openGoals.has(id)?state.openGoals.delete(id):state.openGoals.add(id);render();}
  else if(el.dataset.editGoal){openGoal(el.dataset.editGoal);}
  else if(el.dataset.goalDone){const g=state.goals.find(x=>x.id===el.dataset.goalDone);if(g){saveGoal(Object.assign({},g,{done:!g.done})).then(()=>{if(!g.done)toast('כל הכבוד! היעד הושג 🎉');}).catch(()=>{});}}
  else if(el.dataset.dep){openDeposit(el.dataset.dep);}
  else if(el.dataset.addSaving){openSaving(null,{goalId:el.dataset.addSaving});}
  else if(el.dataset.editSaving){openSaving(el.dataset.editSaving);}
  else if(el.id==='ncSave'){const a=$('#ncA').value.trim(),b=$('#ncB').value.trim();if(a||b)write(store.set('settings',{id:'main',nameA:a,nameB:b})).catch(()=>{});}
});
$('#main').addEventListener('submit',e=>{
  const f=e.target.closest('[data-addstep]');if(!f)return;e.preventDefault();
  const inp=f.querySelector('input');const title=inp.value.trim();if(!title)return;inp.value='';
  saveTask({id:store.newId('tasks'),title,date:null,who:'both',repeat:'none',goalId:f.dataset.addstep,note:'',done:false,doneAt:null,createdAt:Date.now()}).catch(()=>{});
});
let lastDay=today();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&today()!==lastDay){lastDay=today();render();}});

/* ---------- start ---------- */
const CODE_RE=/^[A-Za-z0-9]{24,64}$/;
function newCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';const r=new Uint32Array(28);crypto.getRandomValues(r);return Array.from(r,x=>a[x%a.length]).join('');}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
state.code=null;
function shareLink(){return location.origin+location.pathname+'#'+state.code;}

function welcome(){
  $('#hTitle').textContent='ברוכים הבאים';$('#hSub').textContent='רשימת משימות משותפת לשניכם';$('#hProg').hidden=true;
  $('#fab').hidden=true;document.querySelector('nav.tabs').hidden=true;
  $('#main').innerHTML='<section class="group"><div class="namecard"><p>פעם ראשונה כאן?</p><p class="hint">ניצור רשימה חדשה, ואז תשלחו את הקישור לבן או בת הזוג.</p><div class="sheetbtns"><button class="primary" id="wNew">יצירת רשימה חדשה</button></div></div>'+
    '<div class="namecard"><p>קיבלתם קישור או קוד?</p><p class="hint">פשוט פתחו את הקישור ששלחו לכם. אפשר גם להדביק אותו כאן.</p><input class="inp" id="wCode" placeholder="הדביקו קישור או קוד" autocomplete="off" dir="ltr"><div class="sheetbtns"><button class="ghost" id="wJoin" style="flex:1">הצטרפות</button></div></div></section>';
  $('#wNew').addEventListener('click',()=>start(newCode()));
  $('#wJoin').addEventListener('click',()=>{const v=$('#wCode').value.trim();const c=v.includes('#')?v.split('#').pop():v;if(CODE_RE.test(c))start(c);else toast('הקוד לא נראה תקין. נסו להדביק את כל הקישור');});
}
let fbReady=null;
async function start(code){
  state.code=code;lsSet('beit-code',code);
  if(location.hash.slice(1)!==code){try{history.replaceState(null,'','#'+code);}catch(e){location.hash=code;}}
  document.querySelector('nav.tabs').hidden=false;
  if(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.projectId){
    try{
      const V='10.12.2';
      const [A,R]=await Promise.all([import('https://www.gstatic.com/firebasejs/'+V+'/firebase-app.js'),import('https://www.gstatic.com/firebasejs/'+V+'/firebase-database.js')]);
      const app=A.initializeApp(window.FIREBASE_CONFIG);
      store=makeRtdbStore(R.getDatabase(app),R,code);
    }catch(e){console.error(e);$('#fab').hidden=true;$('#main').innerHTML='<section class="group"><div class="empty"><strong>אין חיבור לרשימה</strong>בדקו את החיבור לאינטרנט ורעננו את הדף.</div></section>';return;}
  } else { state.local=true; store=makeLocalStore(); }
  store.listen(); render();
}
(function init(){
  if(!(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.projectId)){state.local=true;store=makeLocalStore();store.listen();render();return;}
  const h=location.hash.slice(1);
  if(CODE_RE.test(h)) return start(h);
  const saved=lsGet('beit-code');
  if(saved&&CODE_RE.test(saved)) return start(saved);
  welcome();
})();
})();
</script>
